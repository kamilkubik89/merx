<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Merx — Commerce for AI agents</title>
  <desc id="desc">An open-source store engine. Discover, match, negotiate, authorize and order. MCP, A2A and REST. TypeScript, zero runtime dependencies, MIT license.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081e26"/><stop offset="1" stop-color="#103b40"/></linearGradient>
    <linearGradient id="accent" x2="1" y2="1"><stop stop-color="#5eead4"/><stop offset="1" stop-color="#14b8a6"/></linearGradient>
  </defs>
  <rect width="1280" height="640" rx="24" fill="url(#bg)"/>
  <circle cx="1180" cy="80" r="250" fill="#14b8a6" opacity=".05"/>
  <circle cx="1180" cy="80" r="180" fill="none" stroke="#5eead4" opacity=".1"/>
  <rect x="64" y="60" width="72" height="72" rx="18" fill="url(#accent)"/>
  <path d="M82 112V82l18 15 18-15v30" fill="none" stroke="#082f35" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="154" y="112" fill="#f0fdfa" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700">merx</text>
  <text x="66" y="230" fill="#f0fdfa" font-family="Arial, Helvetica, sans-serif" font-size="70" font-weight="700">Commerce for AI agents.</text>
  <text x="68" y="286" fill="#abc9cc" font-family="Arial, Helvetica, sans-serif" font-size="27">A store engine built around verifiable facts and signed orders.</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="22" text-anchor="middle">
    <path d="M168 394H1096" stroke="#408b87" stroke-width="2"/>
    <g fill="#123c43" stroke="#397a7b"><rect x="64" y="362" width="188" height="64" rx="12"/><rect x="296" y="362" width="188" height="64" rx="12"/><rect x="528" y="362" width="188" height="64" rx="12"/><rect x="760" y="362" width="188" height="64" rx="12"/></g>
    <rect x="992" y="362" width="224" height="64" rx="12" fill="#5eead4"/>
    <g fill="#d5f3f1"><text x="158" y="403">Discover</text><text x="390" y="403">Match</text><text x="622" y="403">Negotiate</text><text x="854" y="403">Authorize</text></g>
    <text x="1104" y="403" fill="#082f35" font-weight="700">Signed receipt</text>
  </g>
  <text x="68" y="513" fill="#5eead4" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">MCP  /  A2A  /  REST</text>
  <text x="68" y="572" fill="#abc9cc" font-family="Arial, Helvetica, sans-serif" font-size="20">TypeScript · Zero runtime dependencies · MIT</text>
  <text x="1210" y="572" fill="#abc9cc" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="20">github.com/kamilkubik89/merx</text>
</svg>
