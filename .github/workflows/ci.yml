name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit & integration tests (coverage gate ≥ 90 % lines)
        run: npm run test:coverage

      - name: Coverage summary
        if: always() && hashFiles('lcov.info') != ''
        run: node scripts/coverage-summary.mjs lcov.info

      - name: Upload coverage report
        if: matrix.node == 22 && always() && hashFiles('lcov.info') != ''
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: lcov.info

      - name: Agent-readiness of example catalog (≥ 70)
        run: npm run lint:catalog -- --min 70

      - name: End-to-end demo (scripted buyer agent)
        run: npm run demo
      - name: Capability Feed demo
        run: npm run demo:feed

  docker:
    name: Docker build & smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t merx:ci .
      - name: Smoke test
        run: |
          docker run -d --name merx -p 3000:3000 merx:ci
          for i in $(seq 1 20); do curl -fs localhost:3000/.well-known/merx.json > /dev/null && break; sleep 1; done
          curl -fs localhost:3000/.well-known/merx.json | grep -q '"merx": "0.1"'
          curl -fs -X POST localhost:3000/mcp -H 'content-type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | grep -q find_products
          echo "✅ container serves manifest and MCP" >> "$GITHUB_STEP_SUMMARY"
      - name: Logs on failure
        if: failure()
        run: docker logs merx
