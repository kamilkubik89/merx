name: Release

# Releases are created either by pushing a `v*` tag, or automatically when a
# version bump in package.json lands on main and that tag does not exist yet.
on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: [package.json]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Resolve release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "name=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag="v$(node -p "require('./package.json').version")"
          if gh release view "$tag" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; nothing to do."
          else
            echo "name=$tag" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.tag.outputs.name
        run: npm ci
      - if: steps.tag.outputs.name
        run: npm run check
      - if: steps.tag.outputs.name
        run: npm run site:build
      - name: Create GitHub release
        if: steps.tag.outputs.name
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          notes="docs/releases/$TAG.md"
          if [ -f "$notes" ]; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Merx $TAG" --notes-file "$notes"
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Merx $TAG" --generate-notes
          fi
